        <!-- group modal -->
      <div class="controller-page" id="make-task" style="background-color:#9d9d9d;display: block"><p>应用分组表</p></div>
        <!-- operation modal -->
        <div class="controller-page" id="run-operation" style="background-color:#9d9d9d;display: none">
      <p>基本操作</p>
     <div class="sel-text-group">
      <div class="sel-text" id="set-constant">设置常量</div>
      <div class="sel-text" id="turnoff-mobiledata">关闭移动数据</div>
       <div class="sel-text" id="shot-screen">截屏</div>
         <div class="sel-text" id="make-sound">发响</div>
     </div>
        <p>批量操作</p>
            <div class="sel-text-group">
        <div class="sel-text" id="install-app">安装掘金软件</div>
            <input type="radio"  style="width:10px;height:10px" name="killOrder" name="install-tool" value="1"/>
            <label>同时安装掘金必备应用</label>
            </div>
         <p>高级操作</p>
         <div class="sel-text" id="reset-system">重置手机</div>
      </div>
        <!-- info modal -->
      <div class="controller-page" id="search-info" style="background-color: #9d9d9d;display: none">
          <p>手机配置</p>
      </div>
        <!-- settings modal -->
        <div class="controller-page" id="value-settings" style="background-color: #9d9d9d;display: none">
            <p>参数设置</p>
            <div class="sel-text" id="set-location" style="width:100%"><p>请选择掘金项目包本地地址:</p><div class="input-container" id="group-dir"></div></div>
            <div class="sel-text" id="set-code" style="width:100%"><p>请输入项目分组编号：</p><div class="input-container" id="device-code"></div></div>
            <div class="sel-text" id="set-port" style="width:100%"><p>请输入服务端口号：</p><div class="input-container" id="server-port"></div></div>
            <div class="sel-text" id="set-cmd" style="width:100%"><p>输入Shell命令</p><div class="input-container" id="cli-cmd"></div>
            <div class="sel-text" id="run-cmd">run</div>
            </div>
        </div>
    </div>
