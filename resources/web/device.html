<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AndroidControl - 设备控制</title>
    <link rel="stylesheet" href="static/lib/bootstrap-3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/lib/font-awesome-4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="static/lib/jquery-ui-1.12.1/jquery-ui.min.css">
    <link rel="stylesheet" href="static/css/device.css">
  </head>
  <body>
  <div class="content">
    <div id="main" class="phone-area">
      <div id="content">
        <!-- 顶部导航栏 + 连接状态 -->
        <nav class="navbar">
            <div class="status-indicator">
                <span id="connection-status" class="status-dot"></span>
                <span id="connection-text" class="status-text">连接中...</span>
            </div>
            <p id="title" class="text-center">{{title}}</p>
        </nav>

        <!-- 屏幕显示区域 -->
        <canvas id="phone-screen"></canvas>

        <!-- 底部控制栏 -->
        <footer class="footer">
          <div class="container-fluid">
              <!-- 第一行：导航键 -->
              <div class="row">
                  <div class="col-xs-3 text-center menu-button" id="btn-back" title="返回">
                      <span class="fa fa-chevron-left"></span>
                  </div>
                  <div class="col-xs-3 text-center menu-button" id="btn-home" title="主页">
                      <span class="fa fa-circle-o"></span>
                  </div>
                  <div class="col-xs-3 text-center menu-button" id="btn-menu" title="菜单">
                      <span class="fa fa-align-justify"></span>
                  </div>
                  <div class="col-xs-3 text-center menu-button" id="btn-more" title="设置" data-toggle="modal" data-target="#myModal">
                      <span class="fa fa-cog"></span>
                  </div>
              </div>
              <!-- 第二行：快捷功能 -->
              <div class="row">
                  <div class="col-xs-4 text-center menu-button" id="shot-screen" title="截屏">
                      <span class="fa fa-camera"></span>
                  </div>
                  <div class="col-xs-4 text-center menu-button" id="display-no-sleep" title="屏幕常亮">
                      <span class="fa fa-sun-o"></span>
                  </div>
                  <div class="col-xs-4 text-center menu-button" id="close-data" title="关闭移动数据">
                      <span class="fa fa-wifi"></span>
                  </div>
              </div>
          </div>
        </footer>
      </div>
    </div>

    <!-- 右侧控制面板 -->
    <div class="phone-controller">
      <!-- Tab 导航 -->
      <div class="header-selection">
          <div class="div-selection" id="group" style="background-color:#FFFFFF;">
              <span class="fa fa-th-large"></span>
              <p>任务管理</p>
          </div>
          <div class="div-selection" id="farewell">
              <span class="fa fa-info-circle"></span>
              <p>设备状态</p>
          </div>
          <div class="div-selection" id="operation">
              <span class="fa fa-wrench"></span>
              <p>基本操作</p>
          </div>
          <div class="div-selection" id="settings">
              <span class="fa fa-sliders"></span>
              <p>参数设置</p>
          </div>
      </div>

      <!-- 任务管理页面 -->
      <div class="controller-page" id="make-task" style="background-color:#9d9d9d; display: block;">
          <h4>应用分组管理</h4>
          <p class="text-muted">在此管理设备上的应用安装任务</p>
      </div>

      <!-- 设备状态页面 -->
      <div class="controller-page" id="search-info" style="background-color:#9d9d9d; display: none;">
          <h4>设备信息</h4>
          <div class="info-panel">
              <p><strong>序列号:</strong> <span id="info-sn">-</span></p>
              <p><strong>屏幕尺寸:</strong> <span id="info-screen">-</span></p>
              <p><strong>电量:</strong> <span id="info-battery">-</span></p>
              <p><strong>连接状态:</strong> <span id="info-connection">-</span></p>
          </div>
      </div>

      <!-- 基本操作页面 -->
      <div class="controller-page" id="run-operation" style="background-color:#9d9d9d; display: none;">
          <h4>基本操作</h4>
          <div class="sel-text-group">
              <div class="sel-text" id="set-constant">
                  <span class="fa fa-clock-o"></span> 设置屏幕常亮
              </div>
              <div class="sel-text" id="turnoff-mobiledata">
                  <span class="fa fa-ban"></span> 关闭移动数据
              </div>
              <div class="sel-text" id="make-sound">
                  <span class="fa fa-volume-up"></span> 设备响铃
              </div>
          </div>

          <h4>批量操作</h4>
          <div class="sel-text-group">
              <div class="sel-text" id="install-app">
                  <span class="fa fa-download"></span> 批量安装应用
              </div>
              <div class="checkbox">
                  <label>
                      <input type="checkbox" name="install-tool" value="1"> 同时安装必备工具
                  </label>
              </div>
          </div>

          <h4>高级操作</h4>
          <div class="sel-text" id="reset-system">
              <span class="fa fa-refresh"></span> 重启至 Recovery
          </div>
      </div>

      <!-- 参数设置页面 -->
      <div class="controller-page" id="value-settings" style="background-color:#9d9d9d; display: none;">
          <h4>参数设置</h4>

          <div class="form-group">
              <label>应用包本地路径:</label>
              <div class="input-container" id="group-dir"></div>
          </div>

          <div class="form-group">
              <label>设备分组编号:</label>
              <div class="input-container" id="device-code"></div>
          </div>

          <div class="form-group">
              <label>CLI 服务端口:</label>
              <div class="input-container" id="server-port"></div>
          </div>

          <div class="form-group">
              <label>Shell 命令:</label>
              <div class="input-container" id="cli-cmd"></div>
          </div>

          <button class="btn btn-success" id="run-cmd">
              <span class="fa fa-play"></span> 执行命令
          </button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
      <div class="modal-dialog" role="document">
          <div class="modal-content">
              <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal">&times;</button>
                  <h4 class="modal-title">显示设置</h4>
              </div>
              <div class="modal-body">
                  <div class="form-group">
                      <label>窗口大小</label>
                      <div id="display-scale-slider"></div>
                  </div>
                  <div class="form-group">
                      <label>输出清晰度</label>
                      <div id="scale-slider"></div>
                  </div>
                  <div class="checkbox">
                      <label>
                          <input type="checkbox" id="rotateCheckBox"> 屏幕旋转（横屏模式）
                      </label>
                  </div>
                  <div class="checkbox">
                      <label>
                          <input type="checkbox" id="keyEventCheckBox"> 键盘映射
                      </label>
                      <p class="help-block">将键盘按键映射到 Android 按键事件</p>
                  </div>
              </div>
          </div>
      </div>
  </div>

  <!-- 等待 CapService 重启弹窗 -->
  <div class="modal" id="resetScaleModal" tabindex="-1" role="dialog" data-backdrop="static">
      <div class="modal-dialog" role="document">
          <div class="modal-content">
              <div class="modal-body text-center">
                  <div class="spinner"></div>
                  <p>正在重启 CapService，请稍候...</p>
              </div>
          </div>
      </div>
  </div>

  <script src="static/lib/jquery-3.2.1.min.js"></script>
  <script>if (typeof module === 'object') {window.jQuery = window.$ = module.exports;};</script>
  <script src="static/lib/bootstrap-3.3.7/js/bootstrap.min.js"></script>
  <script src="static/lib/jquery-ui-1.12.1/jquery-ui.min.js"></script>
  <script src="static/lib/vue.js"></script>
  <script src="static/js/keyeventConvert.js"></script>
  <script src="static/js/device.js"></script>
  </body>
</html>
