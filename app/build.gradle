/*
 * Gradle 构建配置
 * 依赖通过 Maven 仓库自动下载，无需手动管理 JAR 文件
 *
 * 使用方法:
 *   .\gradlew.bat app:compileJava    # 编译主代码
 *   .\gradlew.bat app:test           # 运行测试
 *   .\gradlew.bat app:run            # 运行应用
 */

plugins {
    id 'application'
}

// 统一使用 UTF-8 编码，避免中文注释编译失败
compileJava {
    options.encoding = 'UTF-8'
}
compileTestJava {
    options.encoding = 'UTF-8'
}

repositories {
    // 优先使用阿里云镜像（国内访问更快）
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    mavenCentral()
    google()
}

dependencies {

    // ========== JSON 处理 ==========
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'net.sf.json-lib:json-lib:2.4:jdk15'
    implementation 'org.json:json:20240303'

    // ========== Jackson JSON ==========
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.1'

    // ========== 网络通信 ==========
    implementation 'io.netty:netty-all:4.1.108.Final'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'com.neovisionaries:nv-websocket-client:2.14'

    // ========== Apache Commons 工具库 ==========
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'commons-codec:commons-codec:1.17.1'
    implementation 'commons-io:commons-io:2.16.1'

    // ========== Google Guava ==========
    implementation 'com.google.guava:guava:33.0.0-android'

    // ========== 腾讯云 COS SDK (项目包含源码，以下为传递依赖) ==========
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'com.auth0:java-jwt:4.4.0'
    implementation 'com.thoughtworks.xstream:xstream:1.4.21'
    implementation 'joda-time:joda-time:2.12.7'
    implementation 'com.tencentcloudapi:tencentcloud-sdk-java-common:3.1.1429'
    implementation 'com.tencentcloudapi:tencentcloud-sdk-java-kms:3.1.1419'

    // ========== 日志框架 ==========
    // 项目源码使用 log4j 1.x API (org.apache.log4j)
    implementation 'log4j:log4j:1.2.17'

    // ========== HTTPS / 证书工具 ==========
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'

    // ========== HTML 解析 ==========
    implementation 'org.jsoup:jsoup:1.17.2'

    // ========== JavaScript 引擎 (V8) ==========
    // AutoCookieRequest.java 使用 com.eclipsesource.v8.V8
    implementation 'com.eclipsesource.j2v8:j2v8_win32_x86_64:4.6.0'

    // ========== Android 调试工具 ==========
    implementation 'com.android.tools.ddms:ddmlib:25.3.0'
    implementation 'javax.usb:usb-api:1.0.2'

    // ========== 数据库驱动 (运行时) ==========
    runtimeOnly 'mysql:mysql-connector-java:8.0.33'

    // ========== Windows 凭据管理器 (Credential Manager) ==========
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'

    // ========== 本地 JAR (Maven 不可用) ==========
    // geometry-1.0.jar, jnetpcap-1.5.r1457-1i.jar 等无 Maven 坐标的 JAR
    implementation fileTree(dir: 'libs', include: ['geometry-1.0.jar', 'jnetpcap-1.5.r1457-1i.jar'])

    // ========== 测试依赖 ==========
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:4.1.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:4.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

application {
    // 支持 -PmainClass=xxx 临时指定主类，否则使用默认入口
    mainClass = project.hasProperty('mainClass') ? project.property('mainClass') : 'com.MainEntry'
}
